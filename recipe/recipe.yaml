schema_version: 1

context:
  name: asyncclick
  version: "8.4.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asyncclick-${{ version }}.tar.gz
  sha256: 8f259376ae8d4fcd91961c8ad3e85e9b63c9cf181a122201c7dfed3d7f6024b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - flit-core
  run:
    - anyio
    - python >=${{ python_min }}
    - colorama
    - importlib-metadata

tests:
  - python:
      imports:
        - asyncclick
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Composable command line interface toolkit, async version
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://palletsprojects.com/p/click/

extra:
  recipe-maintainers:
    - awvwgk
